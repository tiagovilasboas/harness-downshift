name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    # Only run on version tags (v0.1.0-beta.1, v1.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed to create GitHub releases and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser needs the full git history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
