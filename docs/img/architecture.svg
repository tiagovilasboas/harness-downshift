<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg"
     font-family="'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace">
  <rect width="900" height="700" rx="12" fill="#0d1117"/>

  <!-- Title -->
  <text x="40" y="46" fill="#e6edf3" font-size="18" font-weight="700">Package architecture</text>
  <text x="40" y="64" fill="#5b6373" font-size="11">Dependency direction is one-way: core never imports catalog or adapters.</text>
  <line x1="40" y1="78" x2="860" y2="78" stroke="#21262d" stroke-width="1"/>

  <!-- ══ internal/core ══ -->
  <rect x="320" y="98" width="260" height="84" rx="8" fill="#12331f" stroke="#3d7a56" stroke-width="1.5"/>
  <text x="450" y="120" fill="#7ee2a8" font-size="13" font-weight="700" text-anchor="middle">internal/core</text>
  <text x="450" y="137" fill="#5b6373" font-size="10" text-anchor="middle">Tier · Effort · Complexity · Route</text>
  <text x="450" y="151" fill="#5b6373" font-size="10" text-anchor="middle">EscalationIntent · Decision · Verdict</text>
  <text x="450" y="165" fill="#5b6373" font-size="10" text-anchor="middle">Resolver interface · HarnessCapabilities</text>

  <!-- ══ internal/catalog ══ -->
  <rect x="320" y="242" width="260" height="60" rx="8" fill="#1a2740" stroke="#3d5a8a" stroke-width="1.5"/>
  <text x="450" y="264" fill="#7fb0ff" font-size="13" font-weight="700" text-anchor="middle">internal/catalog</text>
  <text x="450" y="280" fill="#5b6373" font-size="10" text-anchor="middle">catalog.json (embedded · go:embed)</text>
  <text x="450" y="294" fill="#5b6373" font-size="10" text-anchor="middle">~/.harness-downshift override · policy</text>

  <!-- catalog → core -->
  <line x1="450" y1="242" x2="450" y2="182" stroke="#3d5a8a" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="458" y="214" fill="#5b6373" font-size="9">implements Resolver</text>

  <!-- ══ internal/hookutil ══ -->
  <rect x="620" y="242" width="200" height="44" rx="8" fill="#211d30" stroke="#6b5ba8" stroke-width="1.5"/>
  <text x="720" y="263" fill="#b8a4ff" font-size="13" font-weight="700" text-anchor="middle">internal/hookutil</text>
  <text x="720" y="278" fill="#5b6373" font-size="10" text-anchor="middle">StringField · shared utils</text>

  <!-- ══ internal/models ══ -->
  <rect x="620" y="98" width="200" height="60" rx="8" fill="#1a2a1a" stroke="#3d7a56" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="720" y="120" fill="#7ee2a8" font-size="13" font-weight="700" text-anchor="middle">internal/models</text>
  <text x="720" y="136" fill="#5b6373" font-size="10" text-anchor="middle">list · check · pull</text>
  <text x="720" y="150" fill="#5b6373" font-size="10" text-anchor="middle">CatalogReader interface</text>

  <!-- models → catalog -->
  <line x1="680" y1="158" x2="560" y2="242" stroke="#3d5a8a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- ══ adapters ══ -->
  <rect x="40" y="376" width="200" height="56" rx="8" fill="#2a1e16" stroke="#7a5a30" stroke-width="1.5"/>
  <text x="140" y="397" fill="#ffc680" font-size="13" font-weight="700" text-anchor="middle">claudecode</text>
  <text x="140" y="413" fill="#5b6373" font-size="10" text-anchor="middle">PreToolUse · updatedInput</text>
  <text x="140" y="427" fill="#5b6373" font-size="10" text-anchor="middle">claude-code harness</text>

  <rect x="270" y="376" width="200" height="56" rx="8" fill="#2a1e16" stroke="#7a5a30" stroke-width="1.5"/>
  <text x="370" y="397" fill="#ffc680" font-size="13" font-weight="700" text-anchor="middle">cursor</text>
  <text x="370" y="413" fill="#5b6373" font-size="10" text-anchor="middle">preToolUse · updated_input</text>
  <text x="370" y="427" fill="#5b6373" font-size="10" text-anchor="middle">Cursor harness</text>

  <rect x="500" y="376" width="200" height="56" rx="8" fill="#2a1e16" stroke="#7a5a30" stroke-width="1.5"/>
  <text x="600" y="397" fill="#ffc680" font-size="13" font-weight="700" text-anchor="middle">codex</text>
  <text x="600" y="413" fill="#5b6373" font-size="10" text-anchor="middle">PreToolUse · updatedInput</text>
  <text x="600" y="427" fill="#5b6373" font-size="10" text-anchor="middle">multi_agent_v2</text>

  <!-- adapters → core -->
  <line x1="140" y1="376" x2="370" y2="182" stroke="#7a5a30" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
  <line x1="370" y1="376" x2="430" y2="182" stroke="#7a5a30" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
  <line x1="600" y1="376" x2="500" y2="182" stroke="#7a5a30" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>

  <!-- adapters → catalog -->
  <line x1="270" y1="404" x2="320" y2="280" stroke="#3d5a8a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <line x1="500" y1="404" x2="580" y2="280" stroke="#3d5a8a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- adapters → hookutil -->
  <line x1="240" y1="390" x2="620" y2="270" stroke="#6b5ba8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-purple)"/>
  <line x1="700" y1="376" x2="720" y2="286" stroke="#6b5ba8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-purple)"/>

  <!-- ══ telemetry ══ -->
  <rect x="40" y="510" width="200" height="56" rx="8" fill="#1e2a1e" stroke="#3d7a56" stroke-width="1.5"/>
  <text x="140" y="531" fill="#7ee2a8" font-size="13" font-weight="700" text-anchor="middle">internal/telemetry</text>
  <text x="140" y="547" fill="#5b6373" font-size="10" text-anchor="middle">events.jsonl · Record · Stats</text>
  <text x="140" y="561" fill="#5b6373" font-size="10" text-anchor="middle">PrintStats · FilterByDays</text>

  <!-- ══ benchmark ══ -->
  <rect x="270" y="510" width="200" height="56" rx="8" fill="#1e2a1e" stroke="#3d7a56" stroke-width="1.5"/>
  <text x="370" y="531" fill="#7ee2a8" font-size="13" font-weight="700" text-anchor="middle">internal/benchmark</text>
  <text x="370" y="547" fill="#5b6373" font-size="10" text-anchor="middle">Run · Build · TierAccuracy</text>
  <text x="370" y="561" fill="#5b6373" font-size="10" text-anchor="middle">UnsafeDowngradeRates · Print</text>

  <!-- ══ cmd/downshift ══ -->
  <rect x="330" y="614" width="240" height="56" rx="8" fill="#1e1e2e" stroke="#555570" stroke-width="1.5"/>
  <text x="450" y="636" fill="#cdd6f4" font-size="13" font-weight="700" text-anchor="middle">cmd/downshift</text>
  <text x="450" y="652" fill="#5b6373" font-size="10" text-anchor="middle">hook runners · try · models</text>
  <text x="450" y="666" fill="#5b6373" font-size="10" text-anchor="middle">stats · benchmark dispatch</text>

  <!-- cmd → adapters -->
  <line x1="390" y1="614" x2="190" y2="432" stroke="#555570" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>
  <line x1="430" y1="614" x2="370" y2="432" stroke="#555570" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>
  <line x1="510" y1="614" x2="560" y2="432" stroke="#555570" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>

  <!-- cmd → catalog -->
  <line x1="450" y1="614" x2="450" y2="302" stroke="#3d5a8a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- cmd → models -->
  <line x1="560" y1="614" x2="700" y2="158" stroke="#3d7a56" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>

  <!-- cmd → telemetry -->
  <line x1="370" y1="614" x2="200" y2="566" stroke="#3d7a56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- cmd → benchmark -->
  <line x1="410" y1="614" x2="420" y2="566" stroke="#3d7a56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- ══ Legend ══ -->
  <text x="730" y="460" fill="#5b6373" font-size="10" text-anchor="middle">Legend</text>
  <line x1="680" y1="474" x2="710" y2="474" stroke="#3d5a8a" stroke-width="1.5"/>
  <text x="718" y="478" fill="#5b6373" font-size="10">implements</text>
  <line x1="680" y1="492" x2="710" y2="492" stroke="#7a5a30" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="718" y="496" fill="#5b6373" font-size="10">imports (adapter)</text>
  <line x1="680" y1="510" x2="710" y2="510" stroke="#555570" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="718" y="514" fill="#5b6373" font-size="10">imports (cmd)</text>
  <rect x="680" y="523" width="30" height="12" rx="2" fill="none" stroke="#3d7a56" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="718" y="532" fill="#5b6373" font-size="10">separate package</text>

  <!-- ══ Arrow markers ══ -->
  <defs>
    <marker id="arr-blue"   markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3d5a8a"/></marker>
    <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#7a5a30"/></marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6b5ba8"/></marker>
    <marker id="arr-grey"   markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#555570"/></marker>
    <marker id="arr-green"  markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3d7a56"/></marker>
  </defs>
</svg>
